# Illam, self-hosted. Quick start:
#   pnpm setup                                  # writes .env (secrets, keys, household)
#   docker compose --profile bundled-db up -d   # Postgres included
#   pnpm create-user -- --email you@example.com --member alice
#
# Using your own Postgres (Neon, RDS, a local server)? Set DATABASE_URL in .env and run
# `docker compose up -d` without the bundled-db profile.
name: illam

services:
  db:
    image: postgres:17.7-alpine
    profiles: [bundled-db]
    restart: unless-stopped
    environment:
      POSTGRES_USER: illam
      POSTGRES_DB: illam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run node scripts/setup.mjs first}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U illam -d illam']
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    image: amacneil/dbmate:2.28.0
    command: ['--migrations-dir', '/db/migrations', '--no-dump-schema', '--wait', 'up']
    environment:
      DATABASE_URL: ${DATABASE_URL:?run node scripts/setup.mjs first}
    volumes:
      - ./db:/db:ro
    depends_on:
      db:
        condition: service_healthy
        required: false

  rest:
    image: postgrest/postgrest:v13.0.7
    restart: unless-stopped
    environment:
      PGRST_DB_URI: ${DATABASE_URL}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?run node scripts/setup.mjs first}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully

  auth:
    image: supabase/auth:v2.180.0
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: '9999'
      API_EXTERNAL_URL: ${PUBLIC_URL:-http://localhost:8000}/auth/v1
      GOTRUE_SITE_URL: ${PUBLIC_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: ${AUTH_DATABASE_URL:?run node scripts/setup.mjs first}
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Accounts are created with `pnpm create-user`; nobody can sign up from the login page.
      GOTRUE_DISABLE_SIGNUP: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${PUBLIC_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?run node scripts/setup.mjs first}
    restart: unless-stopped
    env_file: .env
    environment:
      # Server-side calls reach the API inside the compose network; the browser uses PUBLIC_URL.
      SUPABASE_INTERNAL_URL: http://gateway:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    depends_on:
      - rest
      - auth

  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '${ILLAM_PORT:-8000}:8000'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
      - rest
      - auth

volumes:
  db-data:
