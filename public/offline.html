<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Offline · Illam</title>
  <style>
    :root { --bg: #f7f7f5; --card: #ffffff; --text: #1c1c1a; --muted: #73736d; --border: #e3e3df; --primary: #23687a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141413; --card: #1c1c1b; --text: #ededea; --muted: #94948e; --border: #30302d; --primary: #74b3c2; }
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .card {
      max-width: 360px;
      margin: 1rem;
      padding: 2rem;
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.875rem;
    }
    img { width: 48px; height: 48px; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0.5rem; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 1.5rem; }
    a {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      border-radius: 0.5rem;
      background: var(--primary);
      color: var(--card);
      font-weight: 500;
      text-decoration: none;
    }
    .from { margin-top: 2rem; font-size: 11px; color: var(--muted); }
    .from strong { display: block; letter-spacing: 0.2em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon.svg" alt="">
    <h1>You're offline</h1>
    <p>Illam can't reach your server right now. Check your connection and try again.</p>
    <a href="/">Try again</a>
    <div class="from">from <strong>Aatra</strong></div>
  </div>
</body>
</html>
