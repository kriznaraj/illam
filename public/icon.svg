<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tile" x1="6" y1="4" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B5BFD"/><stop offset="0.55" stop-color="#2442C9"/><stop offset="1" stop-color="#14287E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(32 37) scale(15 13)">
      <stop stop-color="#FFC94D" stop-opacity="0.55"/><stop offset="1" stop-color="#FFC94D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="32" y1="31" x2="32" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE7A3"/><stop offset="0.45" stop-color="#FFB627"/><stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#tile)"/>
  <rect x="4.75" y="4.75" width="54.5" height="54.5" rx="14.25" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
  <!-- warm light spilling from the doorway -->
  <ellipse cx="32" cy="40" rx="15" ry="13" fill="url(#glow)"/>
  <!-- roof: the left slope climbs like a growth line to the peak -->
  <path d="M13 31.5 L19.5 26 L23.5 28.5 L32 15.5 L51 31.5" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="15.5" r="2.1" fill="#FFC94D"/>
  <!-- walls -->
  <path d="M18 33 V46.5 H46 V33" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the lamp in the doorway -->
  <path d="M32 28.6 C34.7 31.8 35.9 34.2 35.9 36.3 C35.9 38.6 34.1 40.2 32 40.2 C29.9 40.2 28.1 38.6 28.1 36.3 C28.1 34.2 29.3 31.8 32 28.6 Z" fill="url(#flame)"/>
  <path d="M32 33.5 C33 34.8 33.5 35.7 33.5 36.6 C33.5 37.5 32.8 38.2 32 38.2 C31.2 38.2 30.5 37.5 30.5 36.6 C30.5 35.7 31 34.8 32 33.5 Z" fill="#FFF6D8"/>
  <!-- agal vilakku: the clay lamp the flame sits in -->
  <path d="M25.6 41.4 H38.4 C38 43.6 35.4 45 32 45 C28.6 45 26 43.6 25.6 41.4 Z" fill="#FFB627"/>
  <path d="M38.2 41.4 L40.3 40.2" stroke="#FFB627" stroke-width="1.6" stroke-linecap="round"/>
  <!-- kolam dots at the threshold -->
  <circle cx="25" cy="52" r="1.25" fill="#FFFFFF" fill-opacity="0.8"/>
  <circle cx="32" cy="53" r="1.25" fill="#FFC94D"/>
  <circle cx="39" cy="52" r="1.25" fill="#FFFFFF" fill-opacity="0.8"/>
</svg>
