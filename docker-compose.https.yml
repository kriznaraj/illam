# HTTPS on your own domain, with automatic Let's Encrypt certificates.
#   1. Point the domain's DNS A/AAAA record at this server; open ports 80 and 443.
#   2. node scripts/setup.mjs --public-url https://illam.example.com
#   3. DOMAIN=illam.example.com docker compose -f docker-compose.yml -f docker-compose.https.yml --profile bundled-db up -d --build
services:
  gateway:
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN, e.g. DOMAIN=illam.example.com}
    volumes:
      - ./docker/Caddyfile.https:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
